name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  # 先建好草稿, 避免两个平台并行发布时各自新建一个 release
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag matches package.json
        run: test "$GITHUB_REF_NAME" = "$(jq -r .version package.json)"
      # 说明按 .github/release-notes.md 起草, 发布前在草稿里补上正文
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^")
          sed -e "s/{{VERSION}}/$GITHUB_REF_NAME/g" -e "s/{{PREVIOUS}}/$previous/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md

  publish:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: --win }
          - { os: macos-latest, platform: --mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # 架构在 package.json 的 build.win / build.mac 里声明, 每个架构各出一个安装包
      - run: bun run dist ${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ github.token }}
