<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src file: data: https: http:; media-src file: https: http:; font-src 'self' data:"
    />
    <title>Oculis</title>
    <link rel="stylesheet" href="../node_modules/github-markdown-css/github-markdown.css" />
    <link rel="stylesheet" href="../node_modules/highlight.js/styles/github.css" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="../node_modules/highlight.js/styles/github-dark.css" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="./style.css" />
    <script src="../node_modules/pele/dist/pele.global.js" defer></script>
    <script src="./renderer.js" defer></script>
  </head>
  <body>
    <!-- 眼睛几何见 scripts/brand.js, 空窗口时闭眼 -->
    <main id="empty" class="empty">
      <svg class="eye" viewBox="0 0 64 64" aria-hidden="true"><path class="lid" /></svg>
      <p>拖入 Markdown 文件, 或按 <kbd>Ctrl</kbd> + <kbd>O</kbd> 打开</p>
    </main>
    <article id="content" class="markdown-body" hidden></article>
    <!-- 拖入文件时睁眼, 瞳孔被眼形裁切, 上眼睑抬起时露出 -->
    <div class="drop" aria-hidden="true">
      <div class="drop-frame">
        <svg class="eye" viewBox="0 0 64 64">
          <clipPath id="drop-eye"><path class="lid" /></clipPath>
          <circle class="pupil" cx="32" cy="32" r="8" clip-path="url(#drop-eye)" />
          <path class="lid" />
        </svg>
        <p>松开以打开</p>
      </div>
    </div>
  </body>
</html>
