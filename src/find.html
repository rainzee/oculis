<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>查找</title>
    <link rel="stylesheet" href="./find.css" />
    <script src="./find.js" defer></script>
  </head>
  <body>
    <!-- 图标取自 GitHub Octicons -->
    <form class="bar" role="search">
      <label class="field">
        <input id="query" type="text" placeholder="查找" aria-label="查找" autocomplete="off" spellcheck="false" />
        <output id="count" aria-live="polite"></output>
      </label>
      <button id="prev" type="button" title="上一个 (Shift+Enter)" aria-label="上一个">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.22 10.53a.749.749 0 0 1 0-1.06l4.25-4.25a.749.749 0 0 1 1.06 0l4.25 4.25a.749.749 0 0 1-1.042 1.08L8 6.811 4.28 10.53a.749.749 0 0 1-1.06 0Z" />
        </svg>
      </button>
      <button id="next" type="button" title="下一个 (Enter)" aria-label="下一个">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M12.78 5.22a.749.749 0 0 1 0 1.06l-4.25 4.25a.749.749 0 0 1-1.06 0L3.22 6.28a.749.749 0 1 1 1.06-1.06L8 8.939l3.72-3.719a.749.749 0 0 1 1.06 0Z" />
        </svg>
      </button>
      <button id="close" type="button" title="关闭 (Esc)" aria-label="关闭">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z" />
        </svg>
      </button>
    </form>
  </body>
</html>
